---
docker_compose_name: "grafana"
docker_compose:
  image: "registry.{{ domain.name }}.{{ domain.tld }}/docker/grafana"
  version: "11.5.0"
  templates:
    - src: "grafana/entrypoint.sh.j2"
      dest: "entrypoint.sh"
      mode: "0755"
      owner: 101
      group: 102
    - src: "grafana/grafana.ini.j2"
      dest: "config/grafana.ini"
      owner: 101
      group: 102
    - src: "grafana/grafana_datasource.yaml.j2"
      dest: "provisioning/datasources/default.yaml"
      owner: 101
      group: 102
    - src: "grafana/dashboard_provider.yaml.j2"
      dest: "provisioning/dashboards/defaults.yaml"
      owner: 101
      group: 102
    - src: "grafana/grafana_server_defaults.j2"
      dest: "grafana_server_defaults"
      owner: 101
      group: 102
  build:
    from: "{{ containers.cluster.grafana.build_from }}"
    copys:
      - "entrypoint.sh /entrypoint.sh"
    runs:
      - "apt-get update"
      - "echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections"
      - "apt-get install -y --no-install-recommends wget procps libfontconfig curl ca-certificates apt-transport-https software-properties-common gnupg postgresql-client"
      - "wget -q -O - https://packages.grafana.com/gpg.key | gpg --dearmor | tee /etc/apt/trusted.gpg.d/grafana.gpg >/dev/null"
      - 'echo "deb https://packages.grafana.com/oss/deb stable main" > /etc/apt/sources.list.d/grafana.list'
      - "apt-get update && apt-get -y install grafana"
      - "apt-get -y remove wget software-properties-common gnupg"
      - "apt-get -y autoremove && apt-get -y clean autoclean"
      - "mkdir -p /opt/grafana"
      - "touch /run/grafana-server.pid"
      - "chown grafana:grafana /run/grafana-server.pid"
      - "chown -R root:root /opt/grafana"
    exposes:
      - "3000"
    entrypoints:
      - "/entrypoint.sh"
    user: "root"
  services:
    - container_name: "grafana"
      restart: "always"
      volumes:
        - type: "bind"
          source: "/opt/grafana/grafana_server_defaults"
          target: "/etc/default/grafana-server"
        - type: "bind"
          source: "/opt/grafana/config"
          target: "/opt/grafana/config"
        - type: "bind"
          source: "/opt/grafana/data"
          target: "/opt/grafana/data"
        - type: "bind"
          source: "/opt/grafana/dashboards"
          target: "/opt/grafana/dashboards"
        - type: "bind"
          source: "/opt/grafana/provisioning"
          target: "/opt/grafana/provisioning"
      stop_grace_period: "1s"
      mem_limit: "2gb"
      environment:
        - "TZ={{ domain.timezone }}"
      ports:
        - "3000:3000"
      healthcheck:
        test: ["CMD", "curl", "-fs", "localhost:3000/api/health"]
        interval: "20s"
        timeout: "10s"
        retries: 3
  directories:
    - path: "config"
      owner: "101"
      group: "102"
    - path: "data"
      owner: "101"
      group: "102"
    - path: "dashboards"
      owner: "101"
      group: "102"
    - path: "provisioning"
      owner: "101"
      group: "102"
    - path: "provisioning/datasources"
      owner: "101"
      group: "102"
    - path: "provisioning/dashboards"
      owner: "101"
      group: "102"
...
